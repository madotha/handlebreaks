# Handlebreaks, everything in one container: web UI (port 7979), scans and encoding.
# Uses the prebuilt image from GitHub's container registry; nothing to build.
#
#   cp .env.example .env        # enter the folders on the Mac
#   docker compose up -d
#   open http://127.0.0.1:7979
#
# Update: docker compose pull && docker compose up -d
# The tag 3 follows every 3.x release; a new major version (which may need manual steps,
# see the wiki's Updating page) never arrives on its own. HANDLEBREAKS_TAG in .env pins a
# version (e.g. 3.21.0). To build the image from this folder instead, add
# docker-compose.build.yml. To keep encoding natively on the Mac, add docker-compose.hybrid.yml.
#
# Shares inside HOST_MEDIA_DIR appear as /media/<folder>. Shares elsewhere: mount
# them in a local docker-compose.override.yml (gitignored, picked up automatically), e.g.
#   services:
#     encoding:
#       volumes:
#         - /Volumes/Archive/Shows:/media/Archive:ro
services:
  encoding:
    image: ghcr.io/madotha/handlebreaks:${HANDLEBREAKS_TAG:-3}
    container_name: ${CONTAINER_NAME:-handlebreaks}   # another name only to run a second instance next to it
    init: true
    restart: unless-stopped
    stop_grace_period: 2m                      # docker stop: time to requeue the encode in progress and finish a replace
    read_only: true                            # hardening: only the volumes below and /tmp are writable
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: ${TZ:-UTC}                           # local time for logs and stored times (the web UI shows your browser's time anyway)
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-7979}:7979"   # local only by default: there is no login yet
    volumes:
      - data:/data                             # config.env, encoding.db, queue/, logs/
      - ${HOST_MEDIA_DIR:?set HOST_MEDIA_DIR in .env}:/media:ro   # folder with your shares
      - ${HOST_ENCODED_DIR:?set HOST_ENCODED_DIR in .env}:/encoded
      - ${HOST_NOTE_DIR:-notes}:/notes         # optional, otherwise an empty volume

volumes:
  data:
  notes:
