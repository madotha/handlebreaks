# Builds the Docker image for every release tag (vX.Y.Z) and publishes it to the GitHub
# container registry as ghcr.io/madotha/handlebreaks with the tags X.Y.Z, X.Y, X and latest.
# Each architecture builds natively on its own runner (no emulation); a smoke test checks
# the image before anything is published. Started by hand on a branch, it only builds and
# tests. Standard runners and public images are free for public repositories.
name: Docker image

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: handlebreaks:test
          # HandBrakeCLI takes long to build; its stage stays cached until its version changes
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,scope=${{ matrix.arch }},mode=max

      - name: Smoke test
        run: |
          set -eu
          run() { docker run --rm --entrypoint "$1" handlebreaks:test "${@:2}"; }
          version=$(run python3 encoding.py version)
          echo "$version"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "$version" != "Handlebreaks ${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} doesn't match the version in encoding.py ($version)"; exit 1
          fi
          run HandBrakeCLI --version 2>/dev/null | grep -E '^HandBrake [0-9]'
          run ffprobe -version | head -1
          # x265 must encode with a thread pool: built with libnuma it gets none on kernels
          # without NUMA (Docker Desktop's VM) and is about 4x slower
          if run sh -c 'ldd /usr/local/bin/HandBrakeCLI' | grep -q libnuma; then
            echo "::error::HandBrakeCLI links libnuma (configure needs --disable-numa)"; exit 1
          fi
          run sh -c 'ffmpeg -v error -f lavfi -i testsrc2=size=1280x720:rate=25 -t 2 -c:v libx264 /tmp/t.mkv \
            && HandBrakeCLI -i /tmp/t.mkv -o /tmp/o.mkv -e x265 -q 24 2>&1 >/dev/null' \
            | grep -E 'Thread pool created|No thread pool|^encoded' | tee /tmp/x265.txt
          grep -q 'Thread pool created' /tmp/x265.txt || { echo "::error::x265 encoded without a thread pool"; exit 1; }
          audit=$(run python3 encoding.py preset-check)
          echo "$audit"
          echo "$audit" | grep -q 'Settings without an editor field: none' \
            || { echo "::error::preset-check: settings without an editor field"; exit 1; }
          # every key of config.example.env has a settings field, and every setting is in the template
          run python3 webui.py --check-settings || { echo "::error::settings and config.example.env differ"; exit 1; }
          # every API route has a scope, a summary and an example answer
          run python3 webui.py --check-api || { echo "::error::API routes without scope or docs"; exit 1; }
          # the two-factor setup can draw its QR code
          run python3 -c "import segno; segno.make('otpauth://totp/x?secret=A').svg_inline()" || { echo "::error::segno missing"; exit 1; }
          # the web UI starts and answers its health check, with the hardening of docker-compose.yml
          docker run -d --name smoke --read-only --tmpfs /tmp --cap-drop ALL -v smoke-data:/data \
            --security-opt no-new-privileges:true -e TZ=UTC handlebreaks:test
          for i in $(seq 1 30); do
            docker exec smoke python3 -c "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7979/health', timeout=3)" 2>/dev/null && ok=1 && break
            sleep 2
          done
          # the API: a token from the command line reads the status, but nothing outside its scopes
          tok=$(docker exec smoke python3 webui.py --create-token smoke --scopes status:read 2>/dev/null)
          api_status=$(docker exec smoke python3 -c "import urllib.request as u; print(u.urlopen(u.Request('http://127.0.0.1:7979/api/v1/status', headers={'Authorization': 'Bearer $tok'}), timeout=5).status)" 2>&1)
          api_denied=$(docker exec smoke python3 -c "
          import urllib.request as u, urllib.error as e
          try: u.urlopen(u.Request('http://127.0.0.1:7979/api/v1/files', headers={'Authorization': 'Bearer $tok'}), timeout=5); print(200)
          except e.HTTPError as x: print(x.code)" 2>&1)
          wtok=$(docker exec smoke python3 webui.py --create-token smoke-write --scopes queue:write 2>/dev/null)
          api_write=$(docker exec smoke python3 -c "
          import json, urllib.request as u, urllib.error as e
          r = u.Request('http://127.0.0.1:7979/api/v1/queue', data=json.dumps({'keys': ['share1/none.mkv']}).encode(), method='POST',
                        headers={'Authorization': 'Bearer $wtok', 'Content-Type': 'application/json'})
          try: u.urlopen(r, timeout=5); print(200)
          except e.HTTPError as x: print(x.code)" 2>&1)
          api_anon=$(docker exec smoke python3 -c "
          import urllib.request as u, urllib.error as e
          try: u.urlopen('http://127.0.0.1:7979/api/v1/status', timeout=5); print(200)
          except e.HTTPError as x: print(x.code)" 2>&1)
          # pages need a login: without an account they lead to the setup page, whose code is in the log
          gated=$(docker exec smoke python3 -c "import urllib.request; print(urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:7979/status', headers={'Sec-Fetch-Mode': 'navigate'}), timeout=3).url)" 2>&1)
          docker logs smoke | tail -20
          setup_logged=$(docker logs smoke 2>&1 | grep -c 'setup code' || true)
          docker rm -f smoke && docker volume rm smoke-data
          [ "${ok:-0}" = 1 ] || { echo "::error::web UI didn't answer"; exit 1; }
          case "$gated" in */setup*) ;; *) echo "::error::/status didn't lead to the setup page: $gated"; exit 1;; esac
          [ "$setup_logged" -ge 1 ] || { echo "::error::the setup code isn't in the log"; exit 1; }
          [ "$api_status" = 200 ] || { echo "::error::API with a token: $api_status"; exit 1; }
          [ "$api_denied" = 403 ] || { echo "::error::API outside the token's scopes: $api_denied"; exit 1; }
          [ "$api_anon" = 401 ] || { echo "::error::API without a token: $api_anon"; exit 1; }
          [ "$api_write" = 422 ] || { echo "::error::API write with an unknown key: $api_write"; exit 1; }

      - name: Log in to the registry
        if: github.ref_type == 'tag'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push by digest
        if: github.ref_type == 'tag'
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}

      - name: Keep the digest
        if: github.ref_type == 'tag'
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/$(echo '${{ steps.push.outputs.digest }}' | cut -d: -f2)"

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          retention-days: 1

  publish:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v4

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
          flavor: latest=true

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the multi-arch tags
        working-directory: /tmp/digests
        run: |
          # the annotations give the package page on GitHub its description and repository link
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=https://github.com/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.description=Semi-automatic H.264 to H.265 re-encoding of a Plex library with HandBrakeCLI, with a web UI" \
            --annotation "index:org.opencontainers.image.licenses=MIT" \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ env.IMAGE }}@sha256:%s ' *)
          docker buildx imagetools inspect "${{ env.IMAGE }}:${{ steps.meta.outputs.version }}"
