{# Icons (24×24 strokes in currentColor). base.html puts sprite() once into the page; icon('name')
   only references it, so long lists stay small. Folder levels loaded later use the same sprite. #}
{% macro icon(name) -%}
<svg class="i" aria-hidden="true"><use href="#i-{{ name }}"/></svg>
{%- endmacro %}
